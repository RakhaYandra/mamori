- id: secret.api-key
  title: Possible API credential
  severity: high
  category: secret
  recommendation: Move the credential to a secure secret store and rotate it.
  enabled: true
- id: secret.db-conn
  title: Database connection string with credentials
  severity: high
  category: secret
  recommendation: Move the connection string out of source and rotate credentials.
  enabled: true
- id: secret.pem-key
  title: Private key material in file
  severity: high
  category: secret
  recommendation: Keep private keys out of repositories; restrict file permissions.
  enabled: true
- id: secret.generic-assignment
  title: Possible credential assignment
  severity: medium
  category: secret
  recommendation: Move the value to a secure secret store and rotate it.
  enabled: true
- id: secret.env-file
  title: Environment file present
  severity: medium
  category: secret
  recommendation: Do not commit environment files; check Git tracking with `mamori git`.
  enabled: true
