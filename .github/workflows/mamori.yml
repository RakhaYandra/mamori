name: mamori

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Download mamori
        run: |
          V=0.1.2
          curl -fsSLO "https://github.com/RakhaYandra/mamori/releases/download/v${V}/mamori-linux-amd64"
          curl -fsSLO "https://github.com/RakhaYandra/mamori/releases/download/v${V}/SHA256SUMS"
          # Prefix-robust: SHA256SUMS may list bare names or dist/ paths.
          sha=$(sha256sum mamori-linux-amd64 | awk '{print $1}')
          grep -q "$sha" SHA256SUMS || { echo "checksum mismatch"; exit 1; }
          chmod +x mamori-linux-amd64

      - name: Run audit
        run: ./mamori-linux-amd64 audit . --format sarif > results.sarif || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
